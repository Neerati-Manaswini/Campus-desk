spring.application.name=student-management-system

# In-memory H2 database: nothing to install. Data resets on restart.
spring.datasource.url=jdbc:h2:mem:studentsdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# To use MySQL instead, add the mysql-connector-j dependency and replace the lines above with:
# spring.datasource.url=jdbc:mysql://localhost:3306/studentsdb
# spring.datasource.username=root
# spring.datasource.password=your_password
